[project]
name = "katachi"
version = "0.1.0"
description = "Validate, process and document directory structures (local, S3, Azure, ...) against YAML schemas."
authors = [{ name = "Nemanja Micovic", email = "contact.nmicovic@protonmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['directory', 'filesystem', 'schema', 'validation', 'dataset', 'linter', 'fsspec', 'structure']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "fsspec>=2025.5.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.15.3",
]

[project.optional-dependencies]
azure = ["adlfs>=2024.12.0"]

[project.urls]
Homepage = "https://nmicovic.github.io/katachi/"
Repository = "https://github.com/nmicovic/katachi"
Documentation = "https://nmicovic.github.io/katachi/"
Changelog = "https://github.com/nmicovic/katachi/blob/main/CHANGELOG.md"
Issues = "https://github.com/nmicovic/katachi/issues"

[project.scripts]
katachi = "katachi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "deptry>=0.23.0",
    "mypy>=1.15",
    "ruff>=0.16",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.29",
    "types-pyyaml>=6.0.12.20250402",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/katachi", "tests", "README.md", "CHANGELOG.md", "LICENSE", "katachi.schema.json"]



[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "adlfs.*"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped", "no-any-unimported", "union-attr"]

[[tool.mypy.overrides]]
module = "fsspec.*"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped", "no-any-unimported", "union-attr"]

[[tool.mypy.overrides]]
# fsspec has no type stubs, so arguments typed as AbstractFileSystem become Any
module = [
    "katachi.schema.importer",
    "katachi.schema.infer",
    "katachi.utils.fs_utils",
    "katachi.validation.snapshot",
    "katachi.validation.validators",
    "katachi",
]
disable_error_code = ["no-any-unimported"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long exception messages are how Katachi explains schema errors
    "TRY003",
]

[tool.ruff.lint.mccabe]
# The matching hot loop is intentionally inlined for performance
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
"benchmarks/*" = ["S101", "S108", "C901"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.deptry.per_rule_ignores]
DEP002 = ["adlfs"]
