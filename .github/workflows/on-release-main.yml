name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
      - name: Check that the release tag matches the project version
        run: |
          version="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match the version in pyproject.toml ('$version')"
            exit 1
          fi
      - name: Run tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          # Prefer trusted publishing (no secret needed); fall back to an API token if one is configured
          if [ -n "$PYPI_TOKEN" ]; then export UV_PUBLISH_TOKEN="$PYPI_TOKEN"; fi
          uv publish --trusted-publishing automatic dist/*

  deploy-docs:
    name: Deploy documentation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --force
