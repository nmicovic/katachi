name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: ./.github/actions/setup-python-env
      - name: Run checks (lockfile, pre-commit, mypy, deptry)
        run: make check

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest --cov --cov-config=pyproject.toml --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lowest-dependencies:
    name: Tests with the lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - name: Install the oldest allowed versions of the runtime dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e . "pytest>=8.3" "hypothesis>=6.100" "jsonschema>=4.23"
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the CLI
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/katachi --version
          /tmp/smoke/bin/katachi validate tests/schema_tests/test_paired_files/schema.yaml tests/schema_tests/test_paired_files/data
          /tmp/smoke/bin/katachi init --template yolo --output /tmp/yolo.yaml
          /tmp/smoke/bin/katachi check-schema /tmp/yolo.yaml
          /tmp/smoke/bin/python -c "import katachi, pathlib; assert (pathlib.Path(katachi.__file__).parent / 'py.typed').exists()"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict
