name: Run Schema Validation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A new push to a PR cancels the run it replaces; pushes to main each get their own run.
concurrency:
  group: schema-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Owner/collaborator runs go to the self-hosted visas runner; fork PRs (public repo) stay on GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","visas"]') }}
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        pip install -e .

    - name: Run tests
      run: |
        pytest tests/test_schema_validation.py -v

    - name: Run CLI validation tests
      run: |
        python -m katachi validate tests/schema_tests/test_sanity/schema.yaml tests/schema_tests/test_sanity/dataset
        python -m katachi validate tests/schema_tests/test_depth_1/schema.yaml tests/schema_tests/test_depth_1/dataset
